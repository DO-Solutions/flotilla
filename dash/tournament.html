<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flotilla — tournament</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8F%86%3C/text%3E%3C/svg%3E">
<style>
  :root { --bg:#0b1220; --card:#111a2e; --line:#1e2a44; --ink:#e6edf7;
          --dim:#8b9bb8; --accent:#0069ff; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink);
         font:14px/1.5 "Segoe UI",system-ui,sans-serif; padding:18px; }
  header { display:flex; align-items:baseline; gap:14px; margin-bottom:6px;
           flex-wrap:wrap; }
  h1 { font-size:22px; letter-spacing:3px; } h1 span { color:var(--accent); }
  #sub { color:var(--dim); font-size:12px; }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  .btn { display:inline-block; border-radius:6px; padding:3px 12px; font-size:12px; }
  .btn-watch { background:var(--accent); color:#fff; }
  .btn-watch:hover { text-decoration:none; filter:brightness(1.15); }
  .btn-dl { border:1px solid var(--accent); color:var(--accent); background:transparent; }
  .btn-dl:hover { text-decoration:none; background:#0069ff22; }
  .warn { color:#fbbf24; }
  .live { color:#ff5d5d; font-weight:600; }
  .champ { color:#fbbf24; font-weight:600; }
  #ttitle { font-size:26px; letter-spacing:1px; margin:10px 0 2px; }
  #tmeta { color:var(--dim); font-size:13px; margin-bottom:14px; }
  .rounds { display:flex; gap:18px; overflow-x:auto; padding:6px 0 14px;
            align-items:stretch; }
  .rnd { display:flex; flex-direction:column; gap:14px;
         justify-content:space-around; min-width:280px; }
  .rlabel { color:var(--dim); font-size:11px; text-transform:uppercase;
            letter-spacing:2px; text-align:center; }
  .mu { background:var(--card); border:1px solid var(--line); border-radius:10px;
        padding:10px 12px; }
  .mu.liv { border-color:#c2243288; }
  .mu .hd { display:flex; justify-content:space-between; align-items:center;
            gap:8px; margin-bottom:6px; }
  .mu .stat { font-size:11px; color:var(--dim); text-transform:uppercase;
              letter-spacing:1px; white-space:nowrap; }
  .mu .p { display:flex; justify-content:space-between; gap:10px; padding:1px 0;
           font-size:14px; }
  .mu .adv { font-weight:700; }
  .gchips { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
  .gchips .btn { padding:1px 9px; }
  .mu .foot { margin-top:8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:12px 14px; margin-bottom:14px; max-width:560px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:5px 10px 5px 0; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:500; font-size:12px; }
  .shield { filter:blur(6px); user-select:none; pointer-events:none; }
</style>
</head>
<body>
<header>
  <h1>FLO<span>TILLA</span> · <span style="color:#fbbf24">🏆</span> tournament</h1>
  <a class="btn btn-dl reveal" href="#" id="reveal">🙈 results hidden — click to reveal</a>
  <span id="sub">loading…</span>
</header>
<div id="ttitle"></div>
<div id="tmeta"></div>
<div id="bracket" class="rounds"></div>
<div id="standings"></div>
<div id="tstats" style="display:none"></div>
<script>
"use strict";
const $ = id => document.getElementById(id);
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;",
            "'": "&#39;" }[c]));
}
const COLORS = ["#4da3ff", "#ff5d5d", "#a3e635", "#c084fc",
                "#f472b6", "#3fe06a", "#6140e6", "#ca40e6"];
const qs = new URLSearchParams(location.search);
const TNAME = qs.get("t");                 // flagship mode; absent = public copy
let REVEAL = false;
let TJ = null, IDX = null;

// spoiler-shielded value: blurred until the Reveal toggle
const sh = (v) => `<span class="res${REVEAL ? "" : " shield"}">${v}</span>`;

async function loadAll() {
  const base = TNAME ? `tournaments/${encodeURIComponent(TNAME)}/` : "./";
  TJ = await (await fetch(base + "tournament.json")).json();
  if (TNAME) {                    // flagship: the library index adds live
    try { IDX = await (await fetch("index.json")).json(); } catch (e) {}
  } else {
    // public copy: the publish mirrors the matchup slice of the index, so
    // in-flight lanes and their landed games show here too
    try { IDX = await (await fetch("series-index.json")).json(); } catch (e) {}
  }
  render();
}

function playerColor(names, n) {
  const i = names.indexOf(n);
  return COLORS[(i >= 0 ? i : 0) % COLORS.length];
}

function matchupCards() {
  // decided matchups come from tournament.json; IN-FLIGHT ones (games on
  // disk, matchup not yet recorded) come from the library index's matchup
  // series — so a live bracket shows every lane, not just finished ones
  const names = [...new Set((TJ.matchups || []).flatMap(m => m.players))];
  const done = (TJ.matchups || []).map(m => ({
    round: m.round, players: m.players, dir: m.dir, games: m.games,
    winner: m.winner, live: false }));
  const seen = new Set(done.map(m => m.dir));
  // dir names carry STRIPPED labels (Qwen35) — translate back to the real
  // roster labels so colors and schedule-matching line up
  const roster0 = ((TJ.config || {}).participants || []).map(p =>
    typeof p === "string" ? p : (p.label || p.model || "?"));
  const strip = (x) => String(x).replace(/[^A-Za-z0-9_-]/g, "");
  const unstrip = (x) => roster0.find(r => strip(r) === x) || x;
  const extra = [];
  if (IDX) {
    for (const s of IDX.series || []) {
      if (!s.tournament || (TNAME && s.tournament !== TNAME)) continue;
      const dir = s.name.split("/").pop();
      if (seen.has(dir)) continue;
      extra.push({ round: 0, players: dir.split("_", 2).pop()
                     ? dir.replace(/^m\d+_/, "").split("_v_").map(unstrip) : [],
                   dir, games: s.games.map(g => ({
                     game: g.game, file: g.file.replace(/^tournaments\/[^/]+\//, ""),
                     winner: g.winner, scores: null })),
                   winner: null, live: !!s.partial });
    }
  }
  for (const m of [...done, ...extra]) {
    for (const p of m.players) if (!names.includes(p)) names.push(p);
  }
  const mus = [...done, ...extra];
  // while the tournament is LIVE, show the WHOLE round-robin schedule: a
  // lane only reaches the library when its first game lands (games run
  // hours), and an invisible lane reads as "parallelization is off"
  const cfg = (TJ.config && TJ.config.tournament) || {};
  if (TJ.partial && (cfg.format || "round_robin") === "round_robin") {
    const parts = (TJ.config.participants || []).map(p =>
      typeof p === "string" ? p : (p.label || p.model || "?"));
    const roster = [...new Set(parts)];
    for (const p of roster) if (!names.includes(p)) names.push(p);
    const ppm = cfg.players_per_match === 4 ? 4 : 2;
    const sofar = new Set(mus.map(m =>
      m.players.map(x => String(x).replace(/[^A-Za-z0-9_-]/g, "")).join("|")));
    if (ppm === 2) {
      for (let i = 0; i < roster.length; i++) {
        for (let k = i + 1; k < roster.length; k++) {
          const key = [roster[i], roster[k]].map(x =>
            String(x).replace(/[^A-Za-z0-9_-]/g, "")).join("|");
          if (sofar.has(key)) continue;
          mus.push({ round: 9e9, players: [roster[i], roster[k]], dir: null,
                     games: [], winner: null, live: false, pendingLane: true });
        }
      }
    }
  }
  return { names, mus };
}

function gameHref(m, g) {
  if (!TNAME) return `player.html?replay=${encodeURIComponent(m.dir + "/" + g.file.split("/").pop())}`;
  return `player.html?series=${encodeURIComponent(TNAME + "/" + m.dir)}` +
         `&title=${encodeURIComponent(m.players.join(" vs "))}`;
}

function render() {
  const cfg = (TJ.config && TJ.config.tournament) || {};
  const tname = TNAME || (TJ.config && TJ.config.name) || "tournament";
  document.title = `Flotilla — ${tname}`;
  $("ttitle").textContent = tname;
  const { names, mus } = matchupCards();
  const liveN = mus.filter(m => m.live).length;
  $("tmeta").innerHTML =
    `${esc(cfg.format || "round_robin")} · best of ${esc(cfg.games_per_match || 1)}` +
    ` · ${names.map(n => `<b style="color:${playerColor(names, n)}">${esc(n)}</b>`).join(" · ")}` +
    (TJ.partial ? ` · <span class="live">⏳ in progress` +
      (liveN ? ` — ${liveN} series live now` : "") + `</span>`
      : TJ.cancelled ? ` · <span class="warn">✖ ended early</span>`
      : ` · finished`) +
    (!TJ.partial && (TJ.matchups || []).length
      ? ` · <a class="btn btn-dl" href="#" id="statstab">${STATSOPEN
          ? "🏆 back to the bracket"
          : "📊 tournament stats (spoilers)"}</a>` : "");
  $("bracket").style.display = STATSOPEN ? "none" : "";
  $("standings").style.display = STATSOPEN ? "none" : "";
  $("tstats").style.display = STATSOPEN ? "" : "none";
  $("sub").textContent = "";
  // bracket: three status columns — Scheduled | Live | Completed. A series
  // with games on record that is not live IS completed, whatever the
  // tournament.json snapshot says (the public copy is a publish-time
  // snapshot, so "has the matchup record landed" cannot be the test).
  const elim = (cfg.format || "round_robin") === "single_elim";
  const maxRound = Math.max(0, ...mus.map(m =>
    m.round > 0 && m.round < 9e9 ? m.round : 0));
  const statusOf = (m) => m.live ? "live"
    : (m.pendingLane || !(m.games || []).length) ? "sched" : "done";
  const card = (m) => {
    const st = statusOf(m);
    if (st === "sched") {                  // nothing landed yet, nothing to watch
      return `<div class="mu" style="opacity:.6">` +
        `<div class="hd"><span class="stat">⛵ at sea — no games reported ` +
        `yet</span></div>` +
        m.players.map(p => `<div class="p"><span style="color:` +
          `${playerColor(names, p)}">${esc(p)}</span></div>`).join("") +
        `</div>`;
    }
    const wins = {};
    for (const g of m.games || []) {
      if (g.winner) wins[g.winner] = (wins[g.winner] || 0) + 1;
    }
    const rlab = elim && !byRound && m.round > 0 && m.round < 9e9
      ? ` · ${m.round === maxRound ? "final" : "round " + m.round}` : "";
    let h = `<div class="mu${st === "live" ? " liv" : ""}">` +
      `<div class="hd"><span class="stat">${st === "live"
        ? '<span class="live">🔴 series live</span>'
        : (m.winner ? "✓ decided" : "✓ complete") + rlab}</span>` +
      `<a class="btn btn-watch" target="_blank" href="${gameHref(m, (m.games || [])[0] || { file: "g1.json", game: 1 })}"` +
      ` title="watch this series from game 1 — spoiler-free">▶ Watch</a></div>`;
    for (const p of m.players) {
      h += `<div class="p"><span style="color:${playerColor(names, p)}"` +
        `${REVEAL && m.winner === p ? ' class="adv"' : ""}>${esc(p)}` +
        `${REVEAL && m.winner === p ? " 🏆" : ""}</span>` +
        `<span class="stat">${sh(esc(wins[p] || 0))}</span></div>`;
    }
    // per-game links only under spoilers: how many games a series took (and
    // which exist) IS the outcome — Watch is the only spoiler-safe entry
    h += `<div class="gchips">` + (REVEAL ? (m.games || []).map(g =>
      `<a class="btn btn-dl" target="_blank" href="${gameHref(m, g)}">` +
      `▶ g${esc(g.game)}</a>`).join("") : "") +
      (st === "live" ? `<span class="stat live" style="align-self:center">` +
        `next game playing…</span>` : "") + `</div></div>`;
    return h;
  };
  // round_robin reads as a pipeline: Scheduled | Live | Completed. A real
  // BRACKET (single_elim) keeps its by-round shape — advancement is the
  // story there, and cards update in place as games land.
  const byRound = elim;
  let h = "";
  if (byRound) {
    const rounds = {};
    for (const m of mus) (rounds[m.round] = rounds[m.round] || []).push(m);
    for (const r of Object.keys(rounds).sort((a, b) => a - b)) {
      const last = +r === maxRound && maxRound > 0;
      h += `<div class="rnd"><div class="rlabel">${r === "0" ? "in progress"
          : r === "9000000000" ? "still to sail"
          : last ? "final" : "round " + r}</div>` +
        rounds[r].map(card).join("") + `</div>`;
    }
  } else {
    const cols = [["sched", "Scheduled"], ["live", "Live"], ["done", "Completed"]];
    for (const [key, label] of cols) {
      const col = mus.filter(m => statusOf(m) === key);
      h += `<div class="rnd"><div class="rlabel">${label}</div>` +
        (col.length ? col.map(card).join("")
          : `<div class="stat" style="text-align:center;color:var(--dim)">` +
            `— none —</div>`) + `</div>`;
    }
  }
  $("bracket").innerHTML = h || `<div class="card">no matchups yet — the ` +
    `first games are still being played</div>`;
  // standings (spoiler-shielded)
  const rows = Object.entries(TJ.standings || {})
    .sort((a, b) => b[1].wins - a[1].wins || b[1].score - a[1].score);
  $("standings").innerHTML = rows.length
    ? `<div class="card"><h3 style="color:var(--accent);font-size:14px;` +
      `margin-bottom:6px">Standings${TJ.partial ? " (so far)" : ""}</h3>` +
      (TJ.champion ? `<div style="margin-bottom:6px">${sh(
        `<span class="champ">🏆 champion: ${esc(TJ.champion)}</span>`)}</div>` : "") +
      `<table><thead><tr><th>player</th><th>series wins</th><th>games</th>` +
      `<th>total score</th></tr></thead><tbody>` +
      rows.map(([n, s]) =>
        `<tr><td style="color:${playerColor(names, n)}">${esc(n)}</td>` +
        `<td>${sh(esc(s.wins))}</td><td>${sh(esc(s.games))}</td>` +
        `<td>${sh(esc(s.score))}</td></tr>`).join("") +
      `</tbody></table></div>` : "";
}

// ---- tournament-level per-agent stats (completed tournaments) ----
// Aggregates the schedule can't show: every finished replay is fetched once
// and reduced to tournament-wide numbers per admiral. Deliberately NOT the
// per-series story (the series page owns that).
let STATSOPEN = false, STATS = null;
const avg = (a) => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const mmss = (t) => t == null ? "—"
  : `${Math.floor(t / 600)}:${String(Math.floor((t % 600) / 10)).padStart(2, "0")}`;
async function buildStats() {
  const agg = {};
  const A = (n) => agg[n] = agg[n] ||
    { sw: 0, gw: 0, gp: 0, score: [], byGame: {}, fk: [], sunk: [],
      lost: [], cost: [] };
  const base = TNAME ? `tournaments/${encodeURIComponent(TNAME)}/` : "./";
  const jobs = [];
  for (const m of TJ.matchups || []) {
    if (m.winner) A(m.winner).sw++;
    for (const g of m.games || []) jobs.push([m, g]);
  }
  let done0 = 0;
  for (const [m, g] of jobs) {
    $("tstats").innerHTML = `<div class="card">📊 crunching game ` +
      `${++done0} of ${jobs.length}…</div>`;
    let rp;
    try {
      rp = await (await fetch(base + m.dir + "/" +
        String(g.file).split("/").pop())).json();
    } catch (e) { continue; }
    const names = (rp.result || {}).names || {};
    const firstKill = {}, lost = {}, sunk = {};
    for (const e2 of rp.events || []) {
      if (e2.k !== "sink") continue;
      if (e2.by != null && !(e2.by in firstKill)) firstKill[e2.by] = e2.t;
      lost[e2.fleet] = (lost[e2.fleet] || 0) + 1;
      if (e2.by != null) sunk[e2.by] = (sunk[e2.by] || 0) + 1;
    }
    const cost = {};
    for (const d2 of rp.decisions || []) {
      const u = d2.u || {};
      if (u.cost) cost[d2.fleet] = (cost[d2.fleet] || 0) + u.cost;
    }
    for (const [fid, nm] of Object.entries(names)) {
      const a = A(nm);
      a.gp++;
      const sc = (g.scores || {})[nm];
      if (sc != null) {
        a.score.push(sc);
        (a.byGame[g.game] = a.byGame[g.game] || []).push(sc);
      }
      if (g.winner === nm) a.gw++;
      if (firstKill[fid] != null) a.fk.push(firstKill[fid]);
      a.sunk.push(sunk[fid] || 0);
      a.lost.push(lost[fid] || 0);
      a.cost.push(cost[fid] || 0);
    }
  }
  return agg;
}
function renderStats() {
  const names = Object.keys(STATS)
    .sort((a, b) => STATS[b].sw - STATS[a].sw || STATS[b].gw - STATS[a].gw);
  const gnums = [...new Set(names.flatMap(n =>
    Object.keys(STATS[n].byGame).map(Number)))].sort((a, b) => a - b);
  let h = `<div class="card" style="max-width:none"><h3 style="color:var(--accent);` +
    `font-size:14px;margin-bottom:6px">Per-admiral tournament stats</h3>` +
    `<table><thead><tr><th>admiral</th><th>series won</th><th>games won</th>` +
    `<th>avg score</th><th>avg first kill</th><th>avg ships sunk</th>` +
    `<th>avg ships lost</th><th>avg $/game</th></tr></thead><tbody>` +
    names.map(n => {
      const a = STATS[n];
      return `<tr><td style="color:${playerColor(names, n)}">${esc(n)}</td>` +
        `<td>${a.sw}</td><td>${a.gw} / ${a.gp}</td>` +
        `<td>${avg(a.score) != null ? Math.round(avg(a.score)) : "—"}</td>` +
        `<td>${mmss(avg(a.fk))}${a.fk.length < a.gp
          ? ` <span class="warn" title="games with no kill at all are left out">` +
            `(${a.fk.length}g)</span>` : ""}</td>` +
        `<td>${avg(a.sunk).toFixed(1)}</td><td>${avg(a.lost).toFixed(1)}</td>` +
        `<td>$${avg(a.cost).toFixed(2)}</td></tr>`;
    }).join("") + `</tbody></table></div>`;
  h += `<div class="card" style="max-width:none"><h3 style="color:var(--accent);` +
    `font-size:14px;margin-bottom:6px">Average score by game number</h3>` +
    `<div style="color:var(--dim);font-size:12px;margin-bottom:6px">how each ` +
    `admiral's play moves across a series — memo learning shows up here</div>` +
    `<table><thead><tr><th>admiral</th>` +
    gnums.map(g => `<th>game ${g}</th>`).join("") + `</tr></thead><tbody>` +
    names.map(n => `<tr><td style="color:${playerColor(names, n)}">${esc(n)}</td>` +
      gnums.map(g => {
        const v = avg(STATS[n].byGame[g] || []);
        return `<td>${v != null ? Math.round(v) : "—"}</td>`;
      }).join("") + `</tr>`).join("") + `</tbody></table></div>`;
  $("tstats").innerHTML = h;
}
document.addEventListener("click", async e => {
  if (e.target && e.target.id === "statstab") {
    e.preventDefault();
    STATSOPEN = !STATSOPEN;
    render();
    if (STATSOPEN) {
      if (!STATS) STATS = await buildStats();
      renderStats();
    }
  }
});

$("reveal").addEventListener("click", e => {
  e.preventDefault();
  REVEAL = !REVEAL;
  $("reveal").textContent = REVEAL ? "👁 results shown — click to hide"
                                   : "🙈 results hidden — click to reveal";
  render();
});
loadAll().catch(err => { $("sub").textContent = "could not load: " + err; });
if (TNAME) setInterval(() => loadAll().catch(() => {}), 60000);  // live refresh
</script>
</body>
</html>
