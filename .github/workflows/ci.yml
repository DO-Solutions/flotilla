name: tests
# `push` is scoped to main. Unscoped, every PR branch ran the whole suite TWICE
# — once for the push and once for the pull_request — which doubled the spend
# and doubled the exposure to any flake: a run could come back green on one
# event and red on the other for the identical commit, which is exactly what
# test_tournament_pause did for weeks before it was fixed. PRs are still fully
# gated by the pull_request event; main keeps its own run so a direct push or a
# merge commit is verified on its own.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # COLLECT failures, never abort on the first one. Under `bash -e` this
      # loop used to stop at the earliest failing file: a broken test_config.py
      # (5th alphabetically) hid the other 28 sim files AND the server step for
      # 12 pushes. A red X must report every failure it knows about.
      # node is TEST-ONLY (tests/test_viewer_replay.py runs the viewer's real JS
      # canonicalization). Pinned here so the gate can never silently skip it:
      # FLOTILLA_REQUIRE_NODE=1 turns a missing node into a failure rather than a
      # SKIPPED line that reads like a pass. The shipped product is unaffected —
      # still pure-stdlib Python, still one self-contained viewer HTML file.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # jsdom for the Configure-form parity test (tests/test_dash_parity.py),
      # which drives the real dashboard in a real DOM. Installed here rather
      # than committed as a dependency: the shipped product stays pure-stdlib
      # Python plus self-contained HTML, and jsdom never leaves the test lane.
      # Without it that suite would fail rather than skip, which is the point —
      # FLOTILLA_REQUIRE_NODE=1 means a missing tool is a failure, not silence.
      - name: test-only JS deps
        run: npm install --no-save --silent jsdom
      - name: sim tests
        working-directory: sim
        env:
          FLOTILLA_REQUIRE_NODE: "1"
        run: |
          failed=""
          for t in ../tests/test_*.py; do
            [ "$(basename "$t")" = "test_server.py" ] && continue
            echo "::group::$(basename "$t")"
            if python "$t"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::$(basename "$t") FAILED"
              failed="$failed $(basename "$t")"
            fi
          done
          if [ -n "$failed" ]; then
            echo "FAILED:$failed"
            exit 1
          fi
          echo "all sim tests passed"
      # `if: always()` so a sim failure can never hide a server failure again.
      - name: server endpoint tests
        if: always()
        run: python tests/test_server.py
