name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: sim tests
        working-directory: sim
        run: |
          python ../tests/test_config.py
          python ../tests/test_elimination.py
          python ../tests/test_parley.py
          python ../tests/test_territory.py
      - name: server endpoint tests
        run: python tests/test_server.py
